<svg class="sf-paid-launchpad" xmlns="http://www.w3.org/2000/svg" width="518" height="339" viewBox="0 0 518 339" fill="none" stroke="#1daf9c" role="img" aria-labelledby="sf-paid-launchpad-t" aria-describedby="sf-paid-launchpad-d">
<title id="sf-paid-launchpad-t">Paid launchpad</title>
<desc id="sf-paid-launchpad-d">A stack of three glowing glass coins marked with a dollar sign, on a wide iridescent pedestal. A new coin drops onto the stack; as it lands, three streaks of light shoot up out of it, trails behind them, and the stack settles down as the bottom coin sinks away.</desc>
