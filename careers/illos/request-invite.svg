<svg class="sf-request-invite" xmlns="http://www.w3.org/2000/svg" width="518" height="339" viewBox="0 0 518 339" fill="none" stroke="#1daf9c" role="img" aria-labelledby="sf-request-invite-t" aria-describedby="sf-request-invite-d">
<title id="sf-request-invite-t">New applicant</title>
<desc id="sf-request-invite-d">Two glass cubes in isometric joined by a beam of light. Packets of data leave the applicant's cube, tagged New Applicant, ride the beam and enter the second cube, whose glowing core flares as each one arrives.</desc>
